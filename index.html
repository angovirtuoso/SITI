<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SITI · Tickets de Mantenimiento</title>
  <style>
    :root{--navy:#123f67;--blue:#1677bd;--ink:#172033;--muted:#64748b;--line:#d9e2ec;--bg:#f4f7fa;--danger:#be123c;--ok:#047857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}.top{background:#fff;border-bottom:4px solid var(--navy);padding:14px 20px}.brand{max-width:740px;margin:auto;display:flex;align-items:center;gap:16px}.brand img{width:160px;height:auto;display:block}.brand b{display:block;font-size:17px;color:var(--navy)}.brand span{font-size:13px;color:var(--muted)}.page{max-width:740px;margin:22px auto;padding:0 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 12px #1720330d}.hidden{display:none!important}h1{font-size:25px;margin:0 0 5px}h2{font-size:18px;margin:26px 0 12px}.lead{margin:0;color:var(--muted);line-height:1.45}.machine{margin:18px 0;padding:15px;border-left:5px solid var(--blue);background:#eef7fd;border-radius:8px}.machine strong{font-size:18px;display:block}label{font-size:13px;color:#334155;font-weight:700;display:block;margin:15px 0 6px}input,select,textarea,button{width:100%;font:inherit;border-radius:9px}input,select,textarea{border:1px solid #bdcad8;padding:11px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.check{display:flex;align-items:center;gap:8px;margin:14px 0}.check input{width:auto}.check label{margin:0;font-weight:400}button{border:0;padding:13px 16px;background:var(--blue);color:#fff;font-weight:700;margin-top:22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.result{margin-top:18px;padding:16px;border-radius:10px;background:#ecfdf5;border:1px solid #a7f3d0}.result strong{display:block;font-size:18px;color:var(--ok)}.actions{display:flex;gap:10px}.actions button{margin-top:12px}.secondary{background:#e8f0f6;color:var(--navy)}.error{margin:15px 0;padding:12px;background:#fff1f2;color:#9f1239;border-radius:8px}.small{font-size:13px;color:var(--muted)}@media(max-width:560px){.brand img{width:132px}.grid{grid-template-columns:1fr}.panel{padding:17px}.page{margin:14px auto}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><img src="/prodiesa-logo.png" alt="Prodiesa"><div><b>SITI · Mantenimiento</b><span>Sistema de Tickets de Mantenimiento</span></div></div></header>
  <main class="page"><section class="panel">
    <div id="loading">Cargando…</div><div id="error" class="error hidden"></div>
    <div id="openView" class="hidden"><h1>Reportar falla</h1><p class="lead">Captura lo necesario; mantenimiento recibirá el folio y podrá cerrar el ticket desde su liga.</p><div id="machine" class="machine"></div>
      <form id="openForm"><div class="grid"><div><label>Operador</label><select id="operatorId" required></select></div><div><label>PIN de 4 dígitos</label><input id="operatorPin" inputmode="numeric" maxlength="4" required></div><div><label>Prioridad</label><select id="priority" required></select></div><div><label>Tipo de falla</label><select id="failureType" required></select></div></div><label>Parte que falla</label><input id="part" placeholder="Ej. Sensor de salida, banda, motor…"><label>Descripción de la falla</label><textarea id="description" required placeholder="¿Qué sucede? ¿Desde cuándo? ¿Se detuvo la máquina?"></textarea><div class="grid"><div><label>Foto de la falla (opcional)</label><input id="openingPhoto" type="file" accept="image/*" capture="environment"></div></div><div class="check"><input id="productionStop" type="checkbox"><label for="productionStop">Es paro de producción</label></div><div class="check"><input id="qualityStop" type="checkbox"><label for="qualityStop">Es paro por calidad</label></div><button>Crear ticket</button></form></div>
    <div id="closeView" class="hidden"><h1>Cerrar ticket</h1><p class="lead">Registra lo que se corrigió antes de dejar la máquina lista.</p><div id="ticketInfo" class="machine"></div><form id="closeForm"><div class="grid"><div><label>Técnico</label><select id="technicianId" required></select></div><div><label>PIN de 4 dígitos</label><input id="technicianPin" inputmode="numeric" maxlength="4" required></div><div><label>Inicio de reparación</label><input id="repairStart" type="datetime-local"></div><div><label>Tipo de trabajo</label><select id="workType" required></select></div><div><label>Causa raíz</label><select id="rootCause"></select></div></div><label>Corrección realizada</label><textarea id="correction" required placeholder="Describe exactamente qué se hizo."></textarea><label>Refacciones utilizadas</label><input id="partsUsed" placeholder="Si no se usaron, dejar vacío"><label>Comentarios / recomendaciones a producción</label><textarea id="recommendations" placeholder="Ej. revisar lubricación, no operar sin guarda…"></textarea><label>Foto de cierre (opcional)</label><input id="closingPhoto" type="file" accept="image/*" capture="environment"><button>Cerrar ticket</button></form></div>
    <div id="outcome" class="result hidden"></div>
  </section></main>
<script>
const api='/api/tickets', $=id=>document.getElementById(id), params=new URLSearchParams(location.search);let boot,selectedMachine,ticket;
function error(msg){$('error').textContent=msg;$('error').classList.remove('hidden')}function opts(id,items,placeholder='Selecciona…'){const el=$(id);el.innerHTML=`<option value="">${placeholder}</option>`+items.map(x=>`<option value="${String(x.id??x).replaceAll('"','&quot;')}">${x.name??x}</option>`).join('')}
async function get(url){const r=await fetch(url);const x=await r.json();if(!x.ok)throw Error(x.message);return x}async function post(data){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!x.ok)throw Error(x.message);return x}
function compactImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const reader=new FileReader;reader.onload=()=>{const img=new Image;img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function showOutcome(result,state){$('openView').classList.add('hidden');$('closeView').classList.add('hidden');$('outcome').classList.remove('hidden');$('outcome').innerHTML=`<strong>${state==='open'?'Ticket creado':'Ticket cerrado'}: ${result.folio}</strong><p class="small">La tarjeta se guardó en Drive. Compártela manualmente al grupo de WhatsApp.</p><div class="actions"><button id="share">Compartir por WhatsApp</button><button class="secondary" id="card">Ver tarjeta</button></div>`;$('share').onclick=()=>share(result,state);$('card').onclick=()=>window.open(result.cardUrl,'_blank')}
function shareCard(result,state){return new Promise(resolve=>{const c=document.createElement('canvas'),x=c.getContext('2d');c.width=1200;c.height=630;x.fillStyle='#f8fafc';x.fillRect(0,0,c.width,c.height);x.fillStyle='#123f67';x.fillRect(0,0,c.width,82);x.fillStyle='#fff';x.font='700 29px Arial';x.fillText('PRODIESA · MANTENIMIENTO',46,52);x.fillStyle='#64748b';x.font='22px Arial';x.fillText(state==='open'?'TICKET ABIERTO':'TICKET CERRADO',46,125);x.fillStyle='#172033';x.font='700 42px Arial';x.fillText(result.folio,46,190);x.font='26px Arial';let y=250;result.shareText.split('\n').slice(1,5).forEach(line=>{const words=line.split(' ');let row='';words.forEach(word=>{if(x.measureText(row+' '+word).width>1090){x.fillText(row,46,y);y+=42;row=word}else row+=(row?' ':'')+word});if(row){x.fillText(row,46,y);y+=42}});c.toBlob(blob=>resolve(new File([blob],`${result.folio}.png`,{type:'image/png'})),'image/png')})}
async function share(result,state){const text=result.shareText;try{const file=await shareCard(result,state);if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:`Ticket ${result.folio}`,text,files:[file]});return}if(navigator.share){await navigator.share({title:`Ticket ${result.folio}`,text,url:result.ticketUrl});return}window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}catch(e){if(e.name!=='AbortError')window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}}
function machineBox(m){return `<strong>${m['Nombre de máquina']}</strong><span>${m.Área} · ${m.ID}</span>`}
async function init(){try{const folio=params.get('ticket'),machineId=params.get('maquina')||params.get('machine');boot=await get(`${api}?action=bootstrap${machineId?'&machineId='+encodeURIComponent(machineId):''}`);opts('operatorId',boot.operators,'Selecciona operador');opts('technicianId',boot.technicians,'Selecciona técnico');opts('priority',boot.catalogs.priorities,'Selecciona prioridad');opts('failureType',boot.catalogs.failureTypes,'Selecciona tipo');opts('workType',boot.catalogs.workTypes,'Selecciona tipo');opts('rootCause',boot.catalogs.rootCauses,'Por determinar');if(folio){const r=await get(`${api}?action=ticket&folio=${encodeURIComponent(folio)}`);ticket=r.ticket;if(ticket.Estatus==='Cerrado'){error('Este ticket ya está cerrado.');return}$('ticketInfo').innerHTML=`<strong>${ticket.Folio}</strong><span>${ticket.Área} · ${ticket.Máquina}<br>${ticket['Descripción de falla']}</span>`;$('closeView').classList.remove('hidden')}else{selectedMachine=boot.machine;if(!selectedMachine){error('Este QR no identifica una máquina. Usa una liga con ?maquina=ID.');return}$('machine').innerHTML=machineBox(selectedMachine);$('openView').classList.remove('hidden')}$('loading').classList.add('hidden')}catch(e){$('loading').classList.add('hidden');error(e.message)}}
$('openForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await post({action:'open',machineId:selectedMachine.ID,operatorId:$('operatorId').value,pin:$('operatorPin').value,priority:$('priority').value,failureType:$('failureType').value,part:$('part').value,description:$('description').value,productionStop:$('productionStop').checked?'Sí':'No',qualityStop:$('qualityStop').checked?'Sí':'No',photoBase64:await compactImage($('openingPhoto').files[0])});showOutcome(r,'open')}catch(err){error(err.message);b.disabled=false}});
$('closeForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await post({action:'close',folio:ticket.Folio,technicianId:$('technicianId').value,pin:$('technicianPin').value,repairStart:$('repairStart').value,workType:$('workType').value,rootCause:$('rootCause').value,correction:$('correction').value,partsUsed:$('partsUsed').value,recommendations:$('recommendations').value,photoBase64:await compactImage($('closingPhoto').files[0])});showOutcome(r,'close')}catch(err){error(err.message);b.disabled=false}});init();
</script></body></html>
